name: 24/7 Live Attendance Monitor

on:
  schedule:
    - cron: '0 */5 * * *' # Auto-restarts every 5 hours to stay active 24/7
  workflow_dispatch: # Allows manual trigger play execution at any time

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Download Repository Source Code
      uses: actions/checkout@v4

    - name: Configure Cloud Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Critical Web & Database Libraries
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary requests

    - name: Execute Live Real-time Scanner Engine
      working-directory: ${{ github.workspace }}
      env:
        NEON_DB_URL: ${{ secrets.NEON_DATABASE_URL }}
        OFFICE_PC_BRIDGE_URL: ${{ secrets.OFFICE_PC_BRIDGE_URL }}
      run: |
        python .github/workflows/silent_monitor.py
