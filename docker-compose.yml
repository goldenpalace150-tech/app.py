version: '3.8'

services:
  attendance-app:
    build: .
    container_name: golden-palace-attendance
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Damascus
    depends_on:
      - wppconnect
    restart: always

  wppconnect:
    image: wppconnect/wppconnect-server:latest
    container_name: wppconnect-server
    ports:
      - "21465:21465"
    environment:
      - WPP_SECRET_KEY=GoldenPalaceSecret2026  # Replace with a secure key
      - WPP_PORT=21465
    volumes:
      - ./wppconnect-tokens:/home/node/app/tokens
    restart: always
